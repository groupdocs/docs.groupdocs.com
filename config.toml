baseURL                     = "https://docs.groupdocs.com/"
languageCode                = "en"
title                       = "GroupDocs"
theme                       = "hugo-geekdoc"

disableKinds                = ["RSS", "sitemap", "categories", "tags", "taxonomy", "taxonomyTerm"]
enableRobotsTXT             = true   # layouts/robots.txt: sitemaps.xml index on prod, Disallow on QA

# Module mounts: serve _output_files/ and _sample_files/ as static assets
# so Hugo never tries to render .md files inside them as pages. Applies to
# every product (markdown, parser, conversion, etc.).
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
    excludeFiles = ["**/_output_files/**", "**/_sample_files/**", "**/_preview/**"]

  [[module.mounts]]
    source = "content"
    target = "static"
    includeFiles = ["**/_output_files/**", "**/_sample_files/**", "**/_preview/**"]

  # Re-declare default static mount (replaced above because same target)
  [[module.mounts]]
    source = "static"
    target = "static"

  # Page previews of the sample and output files (scripts/doc-preview): each platform's _preview/index.json is
  # also data, so a link to a file learns its preview at build time (_markup/render-link.html).
  [[module.mounts]]
    source = "content"
    target = "data"
    includeFiles = ["**/_preview/index.json"]

  # Re-declare default data mount (replaced above because same target)
  [[module.mounts]]
    source = "data"
    target = "data"


# (Optional) Set this to true to enable 'Last Modified by' date and git author
#  information on 'doc' type pages.
enableGitInfo               = false


# Geekdoc required configuration
pygmentsUseClasses = true
pygmentsCodeFences = true
disablePathToLower = true
pluralizeListTitles = false


# Markup configure section
# See https://gohugo.io/getting-started/configuration-markup/
[markup]
    defaultMarkdownHandler  = "goldmark"    
    [markup.goldmark.renderer]
        unsafe              = true
    [markup.tableOfContents]
        startLevel          = 1
        endLevel            = 4
        ordered             = false
    [markup.highlight]
        noClasses           = false
        style               = "github"

[outputs]
    home                    = [ "HTML", "SITEMAP", "JSON", "MD", "LLMSTXT", "LLMSFULL"]
    section                 = [ "HTML", "MD", "LLMSTXT", "LLMSFULL" ]
    page                    = [ "HTML", "MD" ]

[outputFormats.SITEMAP]
    MediaType               = "application/xml"
    BaseName                = "product-sitemap"
    IsHTML                  = false
    IsPlainText             = true
    noUgly                  = true
    Rel                     = "sitemap"

[mediaTypes."text/markdown"]
    suffixes                = ["md"]

[outputFormats.LLMSTXT]
    mediaType               = "text/plain"
    baseName                = "llms"
    isPlainText             = true
    notAlternative          = true

[outputFormats.LLMSFULL]
    mediaType               = "text/plain"
    baseName                = "llms-full"
    isPlainText             = true
    notAlternative          = true

[outputFormats.MD]
    mediaType               = "text/markdown"
    isPlainText             = true
    isHTML                  = false
    notAlternative          = true
    permalinkable           = false

[Params]
    contentDir              = "content"
    google_tag_manager_id   = "GTM-WZTNN8"
    sitemapMax              = 49999

    disableSearch           = false

    aiSearchEndpoint        = "https://docsearch.api.aspose.cloud/ask"
    aiSearchScopes          = [ "annotation_net",  "annotation_java",  
                                "assembly_net",  "assembly_java", "assembly_python-net", "assembly_nodejs-java",
                                "classification_net",
                                "comparison_net", "comparison_java", "comparison_python-net", "comparison_nodejs-java",
                                "conversion_net", "conversion_java", "conversion_python-net", "conversion_nodejs-java",
                                "editor_net",  "editor_java", "editor_nodejs-java",
                                "markdown_net", "markdown_java", "markdown_python-net",
                                "merger_net",  "merger_java", "merger_python-net", "merger_nodejs-java",
                                "metadata_net", "metadata_java", "metadata_python-net", "metadata_nodejs-java",
                                "parser_net", "parser_java", "parser_python-net", "parser_nodejs-java",
                                "redaction_net", "redaction_java",
                                "search_net", "search_java", "search_python-net", "search_nodejs-java",
                                "signature_net", "signature_java", "signature_python-net", "signature_nodejs-java",
                                "viewer_net", "viewer_java", "viewer_python-net", "viewer_nodejs-java",
                                "watermark_net", "watermark_java", "watermark_python-net", "watermark_nodejs-java",
                                "total_net",   "total_java", "total_python-net", "total_nodejs-java"
                            ]
    # Ask AI on QA builds only (baseURL contains "-qa.", the same check as layouts/robots.txt): sections
    # the Ask AI backend does not index yet. On 2026-11-16 these returned empty answers (HTTP 200, blank
    # summary, no articles), so they stay off in production. Move a scope up to aiSearchScopes once it
    # answers on docs-qa. (utils/ai-search-enabled.html applies both lists.)
    aiSearchScopesQA        = [ "annotation_python-net",
                                "editor_python-net",
                                "redaction_python-net", "redaction_nodejs-java",
                                "annotation_mcp", "assembly_mcp", "comparison_mcp", "conversion_mcp", "editor_mcp",
                                "markdown_mcp", "merger_mcp", "metadata_mcp", "parser_mcp", "redaction_mcp",
                                "search_mcp", "signature_mcp", "viewer_mcp", "watermark_mcp"
                            ]

    # Page actions toolbar under every page title (themes/hugo-geekdoc/layouts/partials/page-actions.html):
    # Ask about this page / Copy for LLM / View as Markdown / Set up agent. One page can opt out with
    # front matter `pageActions: false`.
    pageActions             = true
    # "Ask about this page" opens Ask AI in page mode and sends the page path as `page` with every
    # question (static/js/ai-search.js). true = everywhere, "qa" = QA builds only (baseURL contains
    # "-qa.", same check as layouts/robots.txt), false = hidden. "qa" while the Ask AI team builds
    # `page` support (feature request logged 2026-11-16) so they can test on docs-qa; set to true
    # once it ships.
    askAboutPage            = "qa"
    # Docs MCP server that the "Set up agent" dialog connects clients to (tabs/commands: data/agents.toml)
    docsMcpUrl              = "https://docs.groupdocs.com/mcp"

    # Code example blocks: the {{< tabs >}} blocks that link sample (input) and output files (Claude Design's
    # "code example block" v2; themes/hugo-geekdoc/layouts/partials/doc-preview.html + static/js/doc-preview.js +
    # static/custom.css). IN / OUT tags in the tab row; each file tab starts with a bar: name · type · size and
    # its actions: Show preview (PDF, images, HTML, text; "Show full output" for a truncated text
    # output, "Show files" for a tab with several files), Compare input and output (side-by-side dialog, when the
    # block has both; "View input and output" when the two file types differ, e.g. a PDF in, its extracted text
    # out), Open, Download. The same switch gives every {{< tabs >}} block the new tab style (data-gdx on <html>).
    # true = on, "qa" = QA builds only (baseURL contains "-qa.", same check as layouts/robots.txt), false = off, or a
    # list of sections: on for the pages under them only (the URL starts with /<section>/), everywhere else off.
    # The list rolls the previews out product by product; add a platform once its samples and outputs are ready.
    # The same list rolls out the other theme changes, which apply in those sections only, so the other products build
    # and look exactly as before: the automatic "On this page" ToC (utils/toc-enabled), breadcrumb titles as written
    # (main-groupdocs.css) and scrollbars that follow the theme (custom.css).
    # Off for one page with front matter `docPreview: false`; for a whole product or platform put
    # `cascade: {docPreview: false}` in the front matter of its _index.md.
    docPreview              = ["viewer/net", "viewer/python-net"]
    # false = no "Compare / View input and output" button and dialog
    docPreviewCompare       = true
    # Files up to this size (MB) show as soon as their tab opens; a bigger one waits for "Show preview". Nothing
    # loads with the page either way. 0 = only when a reader clicks. 1 MB covers almost every file in the docs
    # (2026-11-19: all text inputs, about 97% of PDFs, 96% of images, 99% of HTML).
    docPreviewAutoMB        = 1
    # Page images of DOCX, XLSX, PPTX, MSG... files: scripts/doc-preview renders them into each platform's _preview
    # folder (found at build time, no setting). This is where GroupDocs.Viewer.UI is served as static files, to show
    # them in the dialog and a new tab: static/doc-viewer/<version>/, baked from that GroupDocs.Viewer.UI release by
    # `scripts/doc-preview viewer`. HTML outputs rendered with `render --html` open in it in the dialog too, so a DOCX
    # and its HTML output look alike. Empty = the dialog lists the page images itself, and HTML stays the browser's.
    docPreviewViewer        = "/doc-viewer/26.10.0/"

    # Collapse not active menu items by default
    GeekdocCollapseAllSections  = true
    # Disable default Hugo search
    GeekdocSearch               = false
    # Show GroupDocs search input
    showSearchInput             = true

    # Render partial, script and stylesheet for the feedback form
    showFeedbackForm            = true

    # Set source repository location.
    # Used for 'Last Modified' and 'Edit this page' links.
    GitHubRepo              = 'https://github.com/groupdocs/docs'
    
    # Enable 'Edit this page' links for 'doc' page type.
    # Disabled by default. Uncomment to enable. Requires 'GitHubRepo' param.    
    GitHubEditPath          = 'edit/master'   

    GitHubDateFormat        = 'January 2, 2006'

[Params.Sitemap]
	changeFreq              = "weekly"
	priority                = 0.5

# Redirects: authored as Hugo `aliases:` front-matter on the destination page (this is the
# de-facto mechanism across the product docs). This Hugo setup does NOT process a
# Netlify-style redirects table — that syntax was inert here, so it has been removed.
# Wildcard/pattern redirects (e.g. the former /parser/python-net/* -> /parser/python-net/)
# and SEO-grade 301s must be configured server-side in nginx on the deploy host.
